[package]
name = "miupv-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "miupv"
path = "src/main.rs"

[dependencies]
miupv-core = { path = "../miupv-core" }
clap = { version = "4", features = ["derive", "color"] }
clap_complete = "4"
indicatif = "0.17"
console = "0.15"
comfy-table = "7"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
viuer = "0.7"
qrcode = "0.14"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
ratatui = "0.30.2"
crossterm = "0.29.0"
