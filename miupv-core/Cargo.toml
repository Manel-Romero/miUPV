[package]
name = "miupv-core"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
keyring = { version = "3", features = ["sync-secret-service", "linux-native"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["full", "test-util"] }
